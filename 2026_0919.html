!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>図書館情報技術論</title>

<style>
body{
    margin: 0;
    padding: 30px;
    min-height: 100vh;

    background:
    linear-gradient(
        135deg,
        #0f0f0f,
        #1c1c1c,
        #2a2a2a
    );

    font-family: "Yu Gothic", sans-serif;
}

h1{
    width: fit-content;

    margin: 30px auto;

    padding: 15px 45px;

    color: #ffffff;

    background:
    rgba(255,255,255,0.08);

    border: 1px solid rgba(255,255,255,0.2);

    border-radius: 999px;

    letter-spacing: 5px;

    backdrop-filter: blur(10px);

    box-shadow:
    0 0 20px rgba(255,255,255,0.08);
}

hr{
    border: none;

    height: 1px;

    background:
    linear-gradient(
        to right,
        transparent,
        #bdbdbd,
        transparent
    );

    margin-bottom: 35px;
}

.card{
    width: 80%;
    max-width: 800px;

    margin: 0 auto;

    padding: 40px;

    background:
    rgba(255,255,255,0.05);

    border: 1px solid rgba(255,255,255,0.15);

    border-radius: 20px;

    backdrop-filter: blur(12px);

    box-shadow:
    0 8px 30px rgba(0,0,0,0.4);

    color: #f2f2f2;

    line-height: 2;

    box-sizing: border-box;

    position: relative;
}

.card::before{
    content: "✦";

    position: absolute;

    top: 15px;
    left: 20px;

    color: #d9d9d9;

    font-size: 20px;
}

.card::after{
    content: "✦";

    position: absolute;

    top: 15px;
    right: 20px;

    color: #d9d9d9;

    font-size: 20px;
}

p{
    margin-bottom: 25px;
}

a{
    color: #d6d6d6;

    text-decoration: none;

    font-weight: bold;
}

a:hover{
    color: #ffffff;

    text-shadow:
    0 0 8px rgba(255,255,255,0.6);
}
</style>
</head>

<body>

<h1>図書館情報技術論0919</h1>

<hr>

<div class="card">

<p>夏休みは、家でメロンパンやチョコパンなどパン作りに挑戦してみました。</p>

<p>夏目漱石のこころを買ってみたのでこれから読むのが楽しみです。</p>



</div>

</body>
</html>
